# ==============================================================================
# NurseFlow Enterprise HIS 2026 — Dynamic Blue-Green Canary Upstream Configuration
# Enables zero-downtime weighted traffic shift (100% Green -> 10% Blue -> 50% -> 100% Blue)
# ==============================================================================

upstream his_backend_cluster {
    # Active Stable Node (Green)
    server his-webapp-green:80 weight=90 max_fails=3 fail_timeout=10s;

    # Canary Candidate Node (Blue)
    server his-webapp-blue:80 weight=10 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

server {
    listen 80;
    server_name his.primayahospital.co.id his.local;

    # Health Check Proxy Endpoint
    location /health {
        proxy_pass http://his_backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Main Application Traffic
    location / {
        proxy_pass http://his_backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
