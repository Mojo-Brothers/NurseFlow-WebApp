name: NurseFlow Enterprise HIS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🧪 Run Automated Test Suite (Vitest)
        run: npx vitest run

      - name: 🏗️ Run Production Bundle Build (Vite)
        run: npm run build
