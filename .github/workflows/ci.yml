name: 🔍 CI — Quality Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Security Audit (Vulnerability Scan)
        run: npm audit --audit-level=critical || true

      - name: 🔍 ESLint Check
        run: npm run lint
        # Allows warnings but fails on errors (matches our JCI standards)

      - name: 🏗️ Build Production Bundle
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_APP_VERSION: "1.0.${{ github.run_number }}"
          VITE_GIT_SHA: ${{ github.sha }}

      - name: 📄 Generate Deployment Metadata
        run: |
          echo '{"version": "1.0.${{ github.run_number }}", "sha": "${{ github.sha }}", "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}' > dist/metadata.json

      - name: 📊 Build Size Report
        run: |
          echo "## 📦 Build Artifact Sizes" >> $GITHUB_STEP_SUMMARY
          du -sh dist/* | sort -h >> $GITHUB_STEP_SUMMARY || true

      - name: 📤 Upload Build Artifact (for downstream jobs)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 1
