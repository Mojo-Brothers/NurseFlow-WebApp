name: NurseFlow Enterprise HIS CI/CD Quality Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: 🛡️ Enterprise Quality & Clinical Safety Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 Validate Prisma ORM Schema & Invariants
        run: npx prisma validate

      - name: 🧪 Execute Vitest Regression & Negative-Path Suite
        run: npm test

      - name: 🏗️ Execute Vite Production Bundle Build
        run: npm run build
