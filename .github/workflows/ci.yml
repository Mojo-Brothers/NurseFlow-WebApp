name: Enterprise HIS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Lint, Test & Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Quality Scan
        run: npm run lint --if-present

      - name: Execute Vitest Suite
        run: npx vitest run --passWithNoTests

      - name: Run Production Bundle Build
        run: npm run build

      - name: Verify Artifact Output
        run: |
          test -d dist || { echo "Build artifact directory 'dist' missing"; exit 1; }
          echo "✓ Enterprise HIS production bundle verified successfully!"
