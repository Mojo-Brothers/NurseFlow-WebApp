name: 🏥 Deploy — Production (JCI-Grade Pipeline)

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger for hotfix deployments
    inputs:
      skip_firestore_deploy:
        description: "Skip Firestore rules/indexes deploy (use for frontend-only fixes)"
        required: false
        default: "false"
        type: boolean
      reason:
        description: "Reason for manual deployment (audit log)"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false  # NEVER cancel an in-progress production deploy

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build & Quality Gate (Production)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Production Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 💓 Pulse — Workflow Heartbeat
        run: echo "🏗️ Production Build Started"

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Security Audit (Vulnerability Scan)
        run: npm audit --audit-level=critical || true

      - name: 🔍 ESLint Strict Check
        run: npm run lint

      - name: 🏗️ Build Production Bundle
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_APP_ENV: production
          VITE_APP_VERSION: "1.0.${{ github.run_number }}"
          VITE_GIT_SHA: ${{ github.sha }}

      - name: 📄 Generate Deployment Metadata
        run: |
          echo '{"version": "1.0.${{ github.run_number }}", "sha": "${{ github.sha }}", "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}' > dist/metadata.json

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy Firestore Security Rules & Indexes (JCI Critical)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-firestore:
    name: 🔒 Deploy Firestore Rules & Indexes
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    if: ${{ github.event.inputs.skip_firestore_deploy != 'true' }}

    steps:
      - name: 💓 Pulse — Workflow Heartbeat
        run: echo "🔒 Firestore Security Deploy Started"

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔒 Deploy Firestore Security Rules
        run: firebase deploy --only firestore:rules --project ${{ vars.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: 📇 Deploy Firestore Indexes
        run: firebase deploy --only firestore:indexes --project ${{ vars.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy Frontend (Direct Artifact Deployment)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-hosting:
    name: 🌐 Deploy Frontend (Artifact-Only)
    runs-on: ubuntu-latest
    needs: [build, deploy-firestore]
    timeout-minutes: 15
    # Run even if firestore deploy is skipped
    if: always() && needs.build.result == 'success'

    permissions:
      contents: read
      checks: write

    steps:
      - name: 💓 Pulse — Workflow Heartbeat
        run: echo "🌐 Hosting Deploy Started"

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: dist/

      - name: 🔥 Deploy to Firebase Hosting (Live Channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: 🏥 Health Check Pulse (Sanity Test)
        run: |
          echo "Waiting 10s for propagation..."
          sleep 10
          URL="https://${{ vars.FIREBASE_PROJECT_ID }}.web.app"
          echo "Pinging $URL..."
          curl -f -s "$URL/metadata.json" || (echo "::error::Metadata check failed! Site might be down." && exit 1)
          echo "Heartbeat SUCCESS. Metadata reachable."

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Audit Log — JCI Compliance (Clinical Trail Tracking)
  # ─────────────────────────────────────────────────────────────────────────────
  audit-log:
    name: 📋 JCI Audit Log
    runs-on: ubuntu-latest
    needs: [build, deploy-hosting]
    if: always()

    steps:
      - name: 📋 Write Deployment Audit Record
        run: |
          echo "## 🏥 NurseFlow Production Deployment Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Version** | \`1.0.${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`Production (Main)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Job Run ID** | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Manual Reason** | \`${{ github.event.inputs.reason || 'Automated Pipeline' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp (UTC)** | \`$(date -u '+%Y-%m-%d %H:%M:%S')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Result** | \`${{ needs.build.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hosting Deploy** | \`${{ needs.deploy-hosting.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]  " >> $GITHUB_STEP_SUMMARY
          echo "> This log is generated automatically for JCI standard compliance.  " >> $GITHUB_STEP_SUMMARY

      - name: 🚨 Notify on Failure
        if: needs.deploy-hosting.result == 'failure'
        run: |
          echo "::error::Production deployment FAILED. Immediate rollback review required."
          echo "::error::Commit: ${{ github.sha }} | Actor: ${{ github.actor }}"
