name: 🏥 Deploy — Production (JCI-Grade Pipeline)

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger for hotfix deployments
    inputs:
      skip_firestore_deploy:
        description: "Skip Firestore rules/indexes deploy (use for frontend-only fixes)"
        required: false
        default: "false"
        type: boolean
      reason:
        description: "Reason for manual deployment (audit log)"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false  # NEVER cancel an in-progress production deploy

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Quality Gate (must pass before any deployment)
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: 🔍 Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 ESLint Strict Check
        run: npm run lint

      - name: 🏗️ Build Production Bundle
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_APP_ENV: production
          VITE_SENTINEL_VSN: ${{ vars.VITE_SENTINEL_VSN || '2' }}

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: dist/
          retention-days: 30  # Longer retention for production artifacts (audit trail)

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy Firestore Security Rules & Indexes (JCI Critical)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-firestore:
    name: 🔒 Deploy Firestore Rules & Indexes
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 20
    if: ${{ github.event.inputs.skip_firestore_deploy != 'true' }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔒 Deploy Firestore Security Rules
        run: firebase deploy --only firestore:rules --project nurseflow-309c7
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: 📇 Deploy Firestore Indexes
        run: firebase deploy --only firestore:indexes --project nurseflow-309c7
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: ✅ Rules Deploy Summary
        run: |
          echo "## 🔒 Firestore Security Rules Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Rules file**: \`firestore.rules\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Indexes file**: \`firestore.indexes.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy Frontend to Firebase Hosting
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-hosting:
    name: 🌐 Deploy Frontend (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: [quality-gate, deploy-firestore]
    timeout-minutes: 15
    # Run even if firestore deploy is skipped (input was true)
    if: always() && needs.quality-gate.result == 'success'

    permissions:
      checks: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: dist/

      - name: 🔥 Deploy to Firebase Hosting (Live Channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: nurseflow-309c7
          channelId: live  # 👈 Deploys to PRODUCTION live channel
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Audit Log — JCI Compliance (append-only record of every deployment)
  # ─────────────────────────────────────────────────────────────────────────────
  audit-log:
    name: 📋 JCI Audit Log
    runs-on: ubuntu-latest
    needs: [deploy-hosting]
    if: always()  # Always record, even on failure

    steps:
      - name: 📋 Write Deployment Audit Record
        run: |
          echo "## 🏥 NurseFlow Production Deployment Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger Type** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Manual Reason** | \`${{ github.event.inputs.reason || 'Automated push to main' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp (UTC)** | \`$(date -u '+%Y-%m-%d %H:%M:%S')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Quality Gate** | \`${{ needs.quality-gate.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hosting Deploy** | \`${{ needs.deploy-hosting.result }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: 🚨 Notify on Failure
        if: needs.deploy-hosting.result == 'failure'
        run: |
          echo "::error::Production deployment FAILED. Immediate rollback review required."
          echo "::error::Commit: ${{ github.sha }} | Actor: ${{ github.actor }}"
