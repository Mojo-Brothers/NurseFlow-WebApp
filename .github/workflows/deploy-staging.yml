name: 🚀 Deploy — Staging (Preview Channel)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build (Staging)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Staging Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 💓 Pulse — Workflow Heartbeat
        run: |
          echo "🏥 NurseFlow System Pulse: START"
          echo "TIMESTAMP: $(date -u)"
          echo "RUNNER_ID: $GITHUB_RUN_ID"

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Security Audit (Vulnerability Scan)
        run: npm audit --audit-level=critical || true

      - name: 🏗️ Build Production Bundle (Staging Env)
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_APP_ENV: staging
          VITE_APP_VERSION: "1.0.${{ github.run_number }}"
          VITE_GIT_SHA: ${{ github.sha }}

      - name: 📄 Generate Deployment Metadata
        run: |
          echo '{"version": "1.0.${{ github.run_number }}", "sha": "${{ github.sha }}", "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}' > dist/metadata.json

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to Preview Channel
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: 💓 Pulse — Workflow Heartbeat
        run: echo "🚀 Deploy Job Started"

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-dist-${{ github.sha }}
          path: dist/

      - name: 🔥 Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: "staging-${{ github.run_number }}"
          expires: 7d

      - name: 📋 Post Preview URL to Summary
        run: |
          echo "## 🔗 Staging Preview Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`1.0.${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel**: \`staging-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Expires in**: 7 days" >> $GITHUB_STEP_SUMMARY
