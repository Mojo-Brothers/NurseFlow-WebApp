name: 🚀 Deploy — Staging (Preview Channel)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Firebase Staging Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [] # Runs independently (CI runs in parallel)

    permissions:
      checks: write
      pull-requests: write  # Allows posting preview URL as PR comment

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle (Staging Env)
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_APP_ENV: staging
          VITE_SENTINEL_VSN: ${{ vars.VITE_SENTINEL_VSN || '2' }}

      - name: 🔥 Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: nurseflow-309c7
          channelId: "staging-${{ github.run_number }}"
          expires: 7d
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: 📋 Post Preview URL to Summary
        run: |
          echo "## 🔗 Staging Preview Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Channel: staging-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "Expires in: 7 days" >> $GITHUB_STEP_SUMMARY
