version: '3.8'

services:
  # ─── NurseFlow HIS Frontend & Gateway ───
  his-webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nurseflow_his_webapp
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres-db
      - redis-cache
    networks:
      - nurseflow-network

  # ─── Primary Relational Database (PostgreSQL 16) ───
  postgres-db:
    image: postgres:16-alpine
    container_name: nurseflow_postgres_db
    restart: always
    environment:
      POSTGRES_DB: nurseflow_enterprise_his
      POSTGRES_USER: his_admin
      POSTGRES_PASSWORD: HisSecurePassword2026!
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - nurseflow-network

  # ─── High-Speed Distributed Cache & Pub/Sub (Redis 7) ───
  redis-cache:
    image: redis:7-alpine
    container_name: nurseflow_redis_cache
    restart: always
    command: redis-server --appendonly yes --requirepass RedisSecurePassword2026!
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - nurseflow-network

networks:
  nurseflow-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
