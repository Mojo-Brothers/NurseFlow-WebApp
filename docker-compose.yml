version: '3.8'

services:
  # ─── NurseFlow HIS Frontend & Gateway ───
  his-webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nurseflow_his_webapp
    restart: always
    ports:
      - "${PORT:-80}:80"
    env_file:
      - .env
    depends_on:
      - postgres-db
      - redis-cache
    networks:
      - nurseflow-network

  # ─── Primary Relational Database (PostgreSQL 16) ───
  postgres-db:
    image: postgres:16-alpine
    container_name: nurseflow_postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - nurseflow-network

  # ─── High-Speed Distributed Cache & Pub/Sub (Redis 7) ───
  redis-cache:
    image: redis:7-alpine
    container_name: nurseflow_redis_cache
    restart: always
    env_file:
      - .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - nurseflow-network

networks:
  nurseflow-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
