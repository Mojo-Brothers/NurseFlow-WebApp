version: '3.8'

# ==============================================================================
# NurseFlow Enterprise HIS 2026 — Hardened Multi-Device Docker Compose
# Local development credentials should be provided via .env.local or shell env.
# ==============================================================================

services:
  # ─── NurseFlow HIS Frontend & Gateway ───
  his-webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nurseflow_his_webapp
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=80
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - nurseflow-network

  # ─── Primary Relational Database (PostgreSQL 16) ───
  postgres-db:
    image: postgres:16-alpine
    container_name: nurseflow_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nurseflow_enterprise_his}
      POSTGRES_USER: ${POSTGRES_USER:-his_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-his_dev_password_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-his_admin} -d ${POSTGRES_DB:-nurseflow_enterprise_his}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nurseflow-network

  # ─── High-Speed Distributed Cache & Pub/Sub (Redis 7) ───
  redis-cache:
    image: redis:7-alpine
    container_name: nurseflow_redis_cache
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nurseflow-network

networks:
  nurseflow-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
