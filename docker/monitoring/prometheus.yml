# ==============================================================================
# NurseFlow Enterprise HIS 2026 — Prometheus Scrape Configuration
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'nurseflow-his-telemetry'

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # ─── NurseFlow Backend API Telemetry ───
  - job_name: 'nurseflow-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['his-webapp:5000']
        labels:
          environment: 'production'
          tier: 'backend-api'

  # ─── PostgreSQL Database Exporter ───
  - job_name: 'postgresql-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          environment: 'production'
          tier: 'database'

  # ─── Redis Cache Exporter ───
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          environment: 'production'
          tier: 'cache'
