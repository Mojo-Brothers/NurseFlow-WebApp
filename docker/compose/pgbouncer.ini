; ==============================================================================
; NurseFlow Enterprise HIS 2026 — PgBouncer Connection Pooler Configuration
; Target: 2,000 Concurrent Clinical Staff -> Pooled into 200 Database Connections
; ==============================================================================

[databases]
nurseflow_enterprise_his = host=postgres-primary port=5432 dbname=nurseflow_enterprise_his auth_user=his_admin

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

; ─── Connection Pooling Strategy ───
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 150
min_pool_size = 20
reserve_pool_size = 50
reserve_pool_timeout = 5

; ─── Query & Connection Timeouts ───
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 3
client_idle_timeout = 0
query_timeout = 30
query_wait_timeout = 120
idle_transaction_timeout = 60
