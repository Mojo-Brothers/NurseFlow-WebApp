# ==============================================================================
# NurseFlow Enterprise HIS 2026 — PostgreSQL Host-Based Authentication (pg_hba.conf)
# Standard: ISO 27001 Network Security & PostgreSQL Streaming Replication Access
# ==============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     trust

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# Replication connections for Standby Replica & PgBouncer
host    replication     replicator      127.0.0.1/32            scram-sha-256
host    replication     replicator      10.0.0.0/8              scram-sha-256
host    replication     replicator      172.16.0.0/12           scram-sha-256
host    replication     replicator      192.168.0.0/16          scram-sha-256

# Reject all other unencrypted or unauthorized connections
host    all             all             all                     reject
