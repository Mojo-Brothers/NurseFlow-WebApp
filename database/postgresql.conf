# ==============================================================================
# NurseFlow Enterprise HIS 2026 — Hardened Production PostgreSQL 16 Configuration
# Standard: JCI Infrastructure / ISO 27001 Business Continuity & High Concurrency
# Target: 500+ Concurrent Clinical Users, SSD Storage, WAL Streaming Archiving
# ==============================================================================

# ─── 1. Connection & Resource Allocation (PgBouncer Pooling Architecture) ───
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 10
shared_buffers = 1GB
effective_cache_size = 3GB
maintenance_work_mem = 256MB
work_mem = 4MB

# ─── 2. Storage & Disk I/O Optimization (NVMe/SSD) ───
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
min_wal_size = 1GB
max_wal_size = 4GB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# ─── 3. Write-Ahead Logging (WAL) & Streaming Replication (PITR) ───
wal_level = replica
wal_buffers = 16MB
archive_mode = on
archive_command = 'test ! -f /var/backups/nurseflow/postgres/wal_archive/%f && cp %p /var/backups/nurseflow/postgres/wal_archive/%f'
archive_timeout = 300
max_wal_senders = 10
wal_keep_size = 1GB

# ─── 4. Standby & Streaming Replication Parameters ───
hot_standby = on
hot_standby_feedback = on

# ─── 5. Query Tuning & Lock Management (Anti-Deadlock) ───
deadlock_timeout = 1000ms
lock_timeout = 10000ms
statement_timeout = 30000ms
idle_in_transaction_session_timeout = 60000ms

# ─── 6. Security, Auditing & Logging ───
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_statement = 'ddl'
log_timezone = 'Asia/Jakarta'
timezone = 'Asia/Jakarta'
